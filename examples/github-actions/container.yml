name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: theseus-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
      - name: Package runtime configuration
        run: tar -czf "$RUNNER_TEMP/release.tar.gz" theseus.toml
      - name: Deploy to VM
        env:
          THESEUS_SSH_KEY: ${{ secrets.THESEUS_SSH_KEY }}
          THESEUS_KNOWN_HOSTS: ${{ secrets.THESEUS_KNOWN_HOSTS }}
          THESEUS_SSH_DEST: ${{ vars.THESEUS_SSH_DEST }}
          THESEUS_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: bash .github/scripts/theseus-deploy.sh "$RUNNER_TEMP/release.tar.gz"
